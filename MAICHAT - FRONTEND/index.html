<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MAICHAT AI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar collapsed" id="sidebar">

        <div class="sidebar-top">

            <button id="newChat"
                    class="new-chat-btn">
                + New Chat
            </button>

        </div>

        <div class="search-container">
            <input type="search"
                   id="searchInput"
                   placeholder="Search chats...">
        </div>

        <div id="chatList"
             class="chat-list">
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="topbar">

            <button id="toggleSidebar"
                    class="hamburger-btn">
                ☰
            </button>

            <h1>MAICHAT AI</h1>

        </header>

        <!-- WELCOME SCREEN -->
        <section id="welcomeScreen"
                 class="welcome">
<div class="welcome-icon">

    <img
        src="logo.png"
        alt="Maichat luogo">

</div>

            <h2>
                Welcome to MAICHAT
            </h2>

            <p>
                Ask questions, generate ideas,
                write code, and learn more efficiently.
            </p>

            <div class="suggestions">

                <button class="suggestion-card">
                    Explain quantum computing
                </button>

                <button class="suggestion-card">
                    Write a Python function
                </button>

                <button class="suggestion-card">
                    Startup ideas
                </button>

                <button class="suggestion-card">
                    Summarize an article
                </button>

                <button class="suggestion-card">
                    How does AI work?
                </button>

                <button class="suggestion-card">
                    Create content strategy
                </button>

            </div>

        </section>

        <!-- CHAT -->
        <section id="chatContainer"
                 class="chat-container">
        </section>

        <!-- TYPING -->
        <div id="typingIndicator"
             class="typing">

            <span></span>
            <span></span>
            <span></span>

        </div>

        <!-- INPUT -->
        <footer class="input-area">

            <textarea id="messageInput"
                      placeholder="Message MAICHAT..."></textarea>

            <div class="bottom-tools">

                <label for="fileInput" class="tool-btn file-btn">

    <svg width="18"
         height="18"
         viewBox="0 0 24 24"
         fill="none">

        <path d="M21.44 11.05L12.25 20.24a6 6 0 0 1-8.49-8.49L13.66 1.86a4 4 0 1 1 5.66 5.66L8.72 18.12a2 2 0 0 1-2.83-2.83L15.78 5.4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    </svg>

</label>

                <button id="voiceBtn" class="tool-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
        <path d="M19 11a7 7 0 0 1-14 0"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
        <path d="M12 18v3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
        <path d="M8 21h8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
    </svg>
</button>

            </div>

            <button id="sendBtn">

<svg
xmlns="http://www.w3.org/2000/svg"
width="18"
height="18"
fill="none"
viewBox="0 0 24 24">

<path
d="M7 17L17 7M17 7H8M17 7V16"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>

</svg>

            </button>
            <input type="file"
                   id="fileInput"
                   hidden>

        </footer>

    </main>

</div>

<!-- JS -->

<script src="storage.js"></script>
<script src="sidebar.js"></script>
<script src="theme.js"></script>
<script src="voice.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>

</body>
</html>
