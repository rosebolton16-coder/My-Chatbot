<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar collapsed" id="sidebar">

        <div class="sidebar-top">

            <button
                id="newChat"
                class="new-chat-btn">
                + New Chat
            </button>

        </div>

        <input
            type="search"
            id="searchInput"
            placeholder="Search chats..."
        >

        <div id="chatList" class="chat-list"></div>

    </aside>

    <!-- Main -->

    <main class="main">

        <header class="topbar">

            <button
                id="toggleSidebar"
                class="hamburger-btn">
                ☰
            </button>

            <h1>MAICHAT AI</h1>

        </header>

        <section
            id="welcomeScreen"
            class="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <h2>
                Welcome to MAICHAT
            </h2>

            <p>
                Ask questions, generate ideas,
                write code, and learn more efficiently.
            </p>

            <div class="suggestions">

                <button class="suggestion-card">
                    Explain quantum computing
                </button>

                <button class="suggestion-card">
                    Write a Python function
                </button>

                <button class="suggestion-card">
                    Startup ideas
                </button>

                <button class="suggestion-card">
                    Summarize an article
                </button>

                <button class="suggestion-card">
                    How does AI work?
                </button>

                <button class="suggestion-card">
                    Create content strategy
                </button>

            </div>

        </section>

        <section
            id="chatContainer"
            class="chat-container">
        </section>

        <div
            id="typingIndicator"
            class="typing">

            <span></span>
            <span></span>
            <span></span>

        </div>

        <!-- INPUT -->

        <footer class="input-area">

            <textarea
                id="messageInput"
                placeholder="Message MAICHAT..."
            ></textarea>

            <div class="bottom-tools">

                <label
                    for="fileInput"
                    class="tool-btn">
                    📎
                </label>

                <button
                    id="voiceBtn"
                    class="tool-btn">
                    🎤
                </button>

            </div>

            <button
                id="sendBtn">
                ➤
            </button>

            <input
                type="file"
                id="fileInput"
                hidden>

        </footer>

    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/theme.js"></script>
<script src="js/voice.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>

</body>
